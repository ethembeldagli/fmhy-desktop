name: Build

# Every push builds a real installer for all three platforms. That is the only
# way some of this code is verified at all: the Windows WebView2 calls in
# `browser/navigation.rs` cannot be compiled on macOS or Linux, so this
# workflow is where they are type-checked.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Types and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check the frontend
        run: pnpm exec tsc --noEmit

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      # tauri-build resolves `frontendDist` at compile time, so the frontend
      # has to exist before anything Rust will build at all.
      - name: Build the frontend
        run: pnpm build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  bundle:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # webkit2gtk-4.1 is the engine on Linux; rpm builds the .rpm; the
      # gstreamer packages are what `bundleMediaFramework` copies into the
      # AppImage so video plays on a machine that has none of it installed.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file patchelf rpm \
            libgstreamer1.0-0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav

      - run: pnpm install --frozen-lockfile

      # Updater artifacts are signed at bundle time; without these the build
      # fails outright rather than shipping something the app would reject.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  flatpak:
    name: Flatpak (x86_64)
    needs: bundle
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: linux-bundle

      # The manifest builds from the .deb the previous job produced, and
      # expects to find it beside itself under a fixed name.
      - name: Stage the .deb for the manifest
        run: cp "$(find linux-bundle -name '*.deb' | head -n 1)" packaging/flatpak/fmhy-desktop.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fmhy-desktop.flatpak
          manifest-path: packaging/flatpak/org.unofficial.fmhydesktop.yml
          cache-key: flatpak-${{ hashFiles('packaging/flatpak/*.yml') }}

  release:
    name: Publish release
    needs: [bundle, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the working tree, so downloading the
      # artifacts before this would delete them again.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Staging and the update manifest are one step on purpose — an asset
      # staged under one name and referenced under another is a release that
      # installs on nobody. Exits non-zero if a platform is missing its signed
      # payload, rather than stranding it on an old version.
      - name: Stage assets and the update manifest
        run: |
          python3 scripts/stage-release.py artifacts release \
            "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FMHY Desktop ${GITHUB_REF_NAME}" \
            --notes-file - <<'NOTES'
          Unofficial third-party client. Not affiliated with or endorsed by FMHY.

          **Nothing here is code-signed.** The builds are made by GitHub Actions
          with no Apple or Microsoft certificate, so:

          - **macOS** will refuse the first launch. Right-click the app and choose
            Open, or run `xattr -dr com.apple.quarantine "/Applications/FMHY Desktop.app"`.
          - **Windows** SmartScreen will warn. Choose More info, then Run anyway.

          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | `*_aarch64.dmg` |
          | macOS (Intel) | `*_x64.dmg` |
          | Windows | `*_x64_en-US.msi` or `*_x64-setup.exe` |
          | Debian / Ubuntu | `*_amd64.deb` |
          | Fedora / RHEL | `*.x86_64.rpm` |
          | Any Linux | `*_amd64.AppImage` |
          | Flatpak | `fmhy-desktop.flatpak` |

          Already running FMHY Desktop? Settings → Updates will offer this
          release and verify its signature before installing it. Linux updates
          in place only from the AppImage; the `.deb`, `.rpm` and Flatpak
          belong to the package manager that installed them.
          NOTES
